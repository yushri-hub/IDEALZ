        <div class="card">
            <div class="card-title" style="margin-bottom:14px;">🔄 Data & Backup</div>
            
            <div class="backup-status" id="localBackupStatus">
                <span class="backup-dot"></span>
                <span>Auto-backup: <span id="lastBackupTime">Calculating...</span></span>
            </div>
            <div style="height:12px;"></div>
            <button class="btn btn-ghost btn-full btn-sm" onclick="triggerLocalBackup()">💾 Save Local Backup Now</button>

            <div class="divider"></div>

            <div class="admin-only-block">
                <div class="sec-hd">📦 Bulk Export / Import</div>
                <p style="font-size:11.5px;color:var(--text2);margin-bottom:12px;line-height:1.6;">Full data export and import is restricted to administrators only.</p>
                <div class="btn-row" style="margin-bottom:10px;">
                    <button class="btn btn-primary" onclick="exportAllData()">📤 Export All Data</button>
                    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">📥 Import File</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importFromFile(this)">
                <div class="form-group">
                    <label>Paste JSON to Import</label>
                    <textarea id="importJson" style="min-height:70px;font-family:monospace;font-size:11px;" placeholder="Paste exported JSON here..."></textarea>
                </div>
                <button class="btn btn-ghost btn-full" onclick="importFromText()">📥 Import from Pasted Text</button>
                <div class="divider"></div>
                <button class="btn btn-ghost btn-full btn-sm" onclick="restoreFromBackup()">🔁 Restore from Local Backup</button>
            </div>
            <div class="edit-only" style="display:none;" id="operatorDataNote">
                <div class="notice" style="margin-top:10px;">🔒 Bulk export/import is admin-only. Contact your admin for data transfers.</div>
            </div>
        </div>
